<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>交通出門助手</title>
<meta name="description" content="給長輩的公車小幫手：不用看路線圖，打開只顯示下一班公車還有幾分鐘到。">
<meta name="theme-color" content="#0A4C9A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#17191C;--sub:#454A50;--bg:#E8E4D8;--paper:#FFFDF7;--line:#A9A594;--blue:#0A4C9A;--on-blue:#fff;--red:#B3261E;
  --led:#0D0E0C;--amber:#FFB300;--led-txt:#fff;--go:#3DEB7C;--miss:#FF9C8F;--dot:rgba(255,255,255,.055);--mq:0px}
:root[data-mode="white"]{--bg:#fff;--paper:#fff;--line:#222;--sub:#222;--led:#fff;--amber:#000;--led-txt:#000;--go:#00602B;--miss:#A3160C;--dot:transparent}
html{font-size:22px}
html[data-size="1"]{font-size:26px}
html[data-size="2"]{font-size:30px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-weight:500;line-height:1.5;padding-top:var(--mq);-webkit-text-size-adjust:100%}
body.has-marquee{--mq:34px}
button,input{font:inherit;color:inherit}
a{color:var(--blue);font-weight:700;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--blue);z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:16px;font-weight:700;color:var(--on-blue);animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;max-width:640px;margin:0 auto;padding:.5rem 16px .3rem}
.top h1{font-size:1.05rem;font-weight:900;letter-spacing:.02em}
.setbtn{background:none;border:2px solid var(--line);border-radius:.6rem;padding:.2rem .55rem;font-size:.75rem;font-weight:700;min-height:2.2rem;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:0 16px 1.5rem}

/* 站牌卡片 */
.sign{margin:.5rem 0 1rem;border-radius:.9rem;overflow:hidden;background:var(--blue);border:3px solid var(--blue);box-shadow:0 .25rem 0 rgba(0,0,0,.18)}
.sign-top{color:var(--on-blue);padding:.35rem .8rem .4rem;font-size:1.25rem;font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.led{background-color:var(--led);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:7px 7px;color:var(--led-txt);padding:.7rem .8rem .8rem}
.led-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .6rem}
.rt{font-size:1.9rem;font-weight:900;line-height:1.15;color:var(--amber);overflow-wrap:anywhere}
.rt.long{font-size:1.3rem}
.hd{font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:.35rem;color:var(--amber);font-weight:900;line-height:1;margin:.25rem 0 .35rem}
.big b{font-size:clamp(5.2rem,30vw,7.2rem);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big i{font-style:normal;font-size:1.7rem}
.big.word b{font-size:min(3.6rem,16vw);letter-spacing:.02em;padding:.35rem 0}
.hint{font-size:1.15rem;font-weight:900;line-height:1.35}
.hint.go{color:var(--go)}
.hint.miss{color:var(--miss)}
.sign-foot{background:var(--paper);padding:.5rem .7rem .6rem}
.sign-foot p{font-size:.85rem;color:var(--sub);font-weight:700;margin-bottom:.4rem;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(6.5rem,100%),1fr));gap:.4rem}
.acts .btn{padding-left:.15rem;padding-right:.15rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.3rem;width:100%;min-height:3.1rem;padding:.35rem .6rem;border:2px solid var(--blue);border-radius:.7rem;background:var(--paper);color:var(--blue);font-weight:900;font-size:.95rem;line-height:1.25;cursor:pointer;text-decoration:none;text-align:center}
.btn.main{background:var(--blue);color:var(--on-blue);font-size:1.1rem;min-height:3.5rem}
.btn.on{background:var(--amber);border-color:var(--ink);color:#000}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.stack>*+*{margin-top:.55rem}
.upd{text-align:center;font-size:.8rem;color:var(--sub);font-weight:700;margin:.2rem 0 .6rem}

/* 設定流程 */
.q{font-size:1.4rem;font-weight:900;line-height:1.35;margin:.5rem 0 .2rem}
.sub{color:var(--sub);font-size:.9rem;margin-bottom:.6rem}
.step{font-size:.8rem;font-weight:700;color:var(--sub);margin-top:.3rem}
.search{display:flex;gap:.4rem;margin-bottom:.55rem}
.search input,.txt{flex:1;min-width:0;width:100%;height:3.1rem;padding:0 .6rem;border:2px solid var(--ink);border-radius:.7rem;background:var(--paper);font-weight:700}
.search button{flex:none;width:3.1rem;height:3.1rem;border:2px solid var(--blue);border-radius:.7rem;background:var(--paper);font-size:1.1rem;cursor:pointer}
.res{list-style:none;margin:.5rem 0 0;padding:0}
.res li+li{margin-top:.4rem}
.res button{display:block;width:100%;text-align:left;padding:.45rem .7rem;background:var(--paper);border:2px solid var(--line);border-radius:.7rem;cursor:pointer;min-height:3.1rem}
.res b{display:block;font-size:1.05rem;font-weight:900;line-height:1.3}
.res small{display:block;font-size:.75rem;color:var(--sub);line-height:1.3}
.pick{display:flex;align-items:center;gap:.6rem;padding:.45rem .7rem;background:var(--paper);border:2px solid var(--line);border-radius:.7rem;margin-bottom:.4rem;min-height:3.1rem;cursor:pointer}
.pick input{flex:none;width:1.4rem;height:1.4rem;accent-color:var(--blue)}
.pick b{font-weight:900;font-size:1.1rem}
.pick span{font-size:.85rem;color:var(--sub);display:block;line-height:1.3}
.lab{display:block;font-weight:900;margin:.9rem 0 .3rem}
.walk{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.walk .btn{min-height:2.9rem}
.walk .btn[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.linkbtn{background:none;border:none;padding:.5rem 0;color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer;font-size:.9rem;min-height:2.6rem}
.note{background:var(--paper);border:2px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;font-size:.95rem}
.ok-title{font-size:1.5rem;font-weight:900;margin:.8rem 0 .2rem}

/* 常用設定 */
.set-tools{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .6rem}
.set-tools .btn{min-height:2.5rem;font-size:.8rem}
.set-sec{border:2px solid var(--line);border-radius:.7rem;margin-bottom:.5rem;background:var(--paper)}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.6rem .7rem;font-weight:700;min-height:3rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';margin-left:.2rem;transition:transform .2s;flex:none}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0;min-width:0}
.set-sec .ssv{font-weight:500;font-size:.8rem;color:var(--sub);text-align:right}
.set-body{padding:0 .7rem .7rem}
.set-body>*+*{margin-top:.45rem}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg .btn{flex:1 1 auto;width:auto;min-height:2.8rem;font-size:.85rem}
.seg .btn[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.trip-row{border-top:1px solid var(--line);padding-top:.45rem}
.trip-row b{display:block;font-weight:900;overflow-wrap:anywhere}
.trip-row .seg{margin-top:.3rem}

.foot{text-align:center;font-size:.75rem;color:var(--sub);margin-top:1.4rem;line-height:1.7}
.foot .row{display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem .9rem}
.foot button,.foot a{background:none;border:none;padding:.3rem 0;font:inherit;font-weight:700;color:var(--blue);text-decoration:underline;cursor:pointer;min-height:2.2rem}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
.modal.show{display:flex}
.box{background:var(--paper);color:var(--ink);border-radius:1rem;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:1rem}
.box h2{font-size:1.25rem;font-weight:900;margin-bottom:.4rem}
.box ul{margin:.3rem 0 .8rem;padding-left:1.2em}
.box li{margin:.3rem 0}
#ring .box{background:#0D0E0C;color:#fff;text-align:center;border:4px solid #FFB300}
#ring h2{color:#FFB300;font-size:2rem}
#ring p{font-size:1.2rem;font-weight:900;margin-bottom:.8rem}
#toast{position:fixed;left:16px;right:16px;bottom:1.2rem;margin:0 auto;max-width:520px;background:#17191C;color:#fff;font-weight:700;padding:.6rem .8rem;border-radius:.7rem;text-align:center;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#marqueeTrack{animation-duration:90s!important}.set-sec>summary::after{transition:none}}
@media print{#marqueeBar,.acts,.foot{display:none}}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<div class="top">
  <h1>🚏 交通出門助手</h1>
  <button class="setbtn" type="button" id="setBtn">⚙ 常用設定</button>
</div>
<main id="view"></main>

<div class="modal" id="about" role="dialog" aria-modal="true" aria-labelledby="aboutT">
  <div class="box">
    <h2 id="aboutT">⚠ 使用前請看</h2>
    <ul>
      <li>到站時間是公車資料<b>估計</b>的，塞車時會變動，也可能提早到。請提早一點到站牌。</li>
      <li>上車前請看清楚<b>車號和方向</b>。</li>
      <li>不要為了趕車奔跑，過馬路請注意安全。錯過了就等下一班。</li>
      <li>目前只有<b>台北市、新北市</b>的公車。資料來自兩市政府開放資料，這個工具不是官方服務。</li>
      <li>您常去的地方只存在這支手機。用「我的位置」找站牌時，位置不會傳出去。</li>
    </ul>
    <button class="btn main" type="button" id="aboutOk">我知道了</button>
  </div>
</div>
<div class="modal" id="ring" role="alertdialog" aria-modal="true" aria-labelledby="ringT">
  <div class="box">
    <h2 id="ringT">該出門了！</h2>
    <p id="ringM"></p>
    <button class="btn main" type="button" id="ringOk">知道了</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
var PREFIX = 'nbh.', TRIPS_KEY = PREFIX + 'trips', SET_KEY = PREFIX + 'settings', FOLD_KEY = PREFIX + 'fold', WARN_KEY = PREFIX + 'warnSeen';
var ETA_URL = 'https://next-bus-eta.content-workflow.workers.dev/eta';
var BADGE = 'https://visitor-badge.laobi.icu/badge?page_id=m255525.nextbushelper';
var POLL = 30000, KEEP = 90000, MAX_BUS = 12;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove('show'); }, 3200); }

var trips = []; try{ trips = JSON.parse(lsGet(TRIPS_KEY) || '[]') || []; }catch(e){ trips = []; }
var S = {size:0, mode:'led', rate:.85}; try{ Object.assign(S, JSON.parse(lsGet(SET_KEY) || '{}')); }catch(e){}
function saveTrips(){ lsSet(TRIPS_KEY, JSON.stringify(trips)); }
function saveSet(){ lsSet(SET_KEY, JSON.stringify(S)); applySet(); }
function applySet(){ document.documentElement.dataset.size = S.size; document.documentElement.dataset.mode = S.mode; }

/* ---------- 站牌索引（只有設定時才下載） ---------- */
var IDX = null, idxLoading = null;
function norm(s){ return String(s || '').replace(/臺/g, '台').replace(/[\s　]/g, '').toLowerCase(); }
function baseOf(k){ return k.replace(/[(（].*$/, '') || k; }
function plainName(n){ return String(n).replace(/[(（].*$/, '') || n; }
/* 臺北車站(忠孝)、(重慶)…是同一地方的不同站位：上車要分開選，下車當同一個地方 */
function sameSpot(c){ return IDX.byBase[c.base].filter(function(x){ return dist(c.lat, c.lon, x.lat, x.lon) < 1000; }).map(function(x){ return x.i; }); }
/* 對向站牌常常叫別的名字，找不到同名站時放寬到附近 */
function nearSpots(list, m){ var o = {}; list.forEach(function(i){ var c = IDX.cl[i]; IDX.cl.forEach(function(x){ if(dist(c.lat, c.lon, x.lat, x.lon) < m) o[x.i] = 1; }); }); return Object.keys(o).map(Number); }
function dist(a, b, c, d){ var x = (d - b) * 101000, y = (c - a) * 111000; return Math.sqrt(x * x + y * y); }
function loadIndex(){
  if(IDX) return Promise.resolve(IDX);
  if(idxLoading) return idxLoading;
  idxLoading = fetch('stops-data.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
    var byName = {}, byBase = {}, cl = [], of = new Int32Array(d.p.length);
    d.p.forEach(function(p, i){
      var k = norm(p[0]), list = byName[k] || (byName[k] = []), hit = null;
      for(var j = 0; j < list.length; j++){ if(dist(list[j].lat, list[j].lon, p[1], p[2]) < 600){ hit = list[j]; break; } }
      if(!hit){ hit = {i:cl.length, name:p[0], key:k, base:baseOf(k), lat:p[1], lon:p[2], addr:p[3]}; cl.push(hit); list.push(hit); (byBase[hit.base] = byBase[hit.base] || []).push(hit); }
      of[i] = hit.i;
    });
    IDX = {cl:cl, of:of, r:d.r, v:d.v, byBase:byBase}; return IDX;
  }).catch(function(e){ idxLoading = null; throw e; });
  return idxLoading;
}
function search(q){
  var k = norm(q); if(!k) return [];
  var out = [];
  IDX.cl.forEach(function(c){ var i = c.key.indexOf(k); if(i < 0) return; out.push({c:c, s:(c.key === k ? 0 : i === 0 ? 1 : 2) * 100 + c.key.length}); });
  out.sort(function(a, b){ return a.s - b.s; });
  return out.slice(0, 20).map(function(x){ return x.c; });
}
function nearby(lat, lon){
  var out = [];
  IDX.cl.forEach(function(c){ var m = dist(lat, lon, c.lat, c.lon); if(m < 1200) out.push({c:c, m:m}); });
  out.sort(function(a, b){ return a.m - b.m; });
  return out.slice(0, 12);
}
/* 從 A 到 B 的直達車；b 是站位編號陣列，省略＝這站看得到的所有路線 */
function findBuses(a, b){
  var seen = {}, res = [], bs = null;
  if(b != null){ bs = {}; b.forEach(function(i){ bs[i] = 1; }); }
  IDX.r.forEach(function(r){
    var p = r[3], last = -1, stops = 0, at = -1;
    for(var k = 0; k < p.length; k++){
      var c = IDX.of[p[k]];
      if(b == null){ if(c === a && k < p.length - 1){ at = k; stops = p.length - 1 - k; break; } }
      else if(c === a){ last = k; }
      else if(bs[c] && last >= 0){ at = last; stops = k - last; break; }
    }
    if(at < 0) return;
    var key = r[0] + '|' + r[1], x = {r:r[0], h:r[1], c:r[2], s:r[4][at], stops:stops};
    if(!seen[key] || stops < seen[key].stops){ if(seen[key]) res.splice(res.indexOf(seen[key]), 1); seen[key] = x; res.push(x); }
  });
  res.sort(function(x, y){ return b == null ? String(x.r).localeCompare(String(y.r), 'zh-Hant', {numeric:true}) : x.stops - y.stops; });
  return res;
}

/* ---------- 到站時間 ---------- */
var etas = {}, etaAt = 0, tpAt = null, pollT = null, fetching = false, down = {}, pollBad = false, keep = KEEP;
function chunk(list, n){ var o = []; for(var i = 0; i < list.length; i += n) o.push(list.slice(i, i + n)); return o; }
function poll(){
  clearTimeout(pollT);
  if(currentView() !== 'home' || document.hidden || !trips.length) return Promise.resolve();
  pollT = setTimeout(poll, POLL);
  if(fetching) return Promise.resolve();
  var seen = {}, all = [];
  trips.forEach(function(t){ t.b.forEach(function(b){ var k = b.c + b.s; if(!seen[k]){ seen[k] = 1; all.push(b); } }); });
  fetching = true;
  return Promise.all(chunk(all, 30).map(function(g){
    var q = {t:[], n:[]}; g.forEach(function(b){ q[b.c].push(b.s); });
    var u = ETA_URL + '?' + ['t', 'n'].filter(function(c){ return q[c].length; }).map(function(c){ return c + '=' + q[c].join(','); }).join('&');
    return fetch(u).then(function(r){ return r.json(); });
  })).then(function(rs){
    var e = {}, bad = false, dn = {};
    rs.forEach(function(d){ if(!d.ok) bad = true; Object.assign(e, d.r || {}); if(d.tpAt) tpAt = d.tpAt; (d.miss || []).forEach(function(c){ dn[c] = 1; }); });
    if(!bad || Object.keys(e).length){ etas = e; etaAt = Date.now(); down = dn; }
    pollBad = bad || Object.keys(dn).length > 0;
  }).catch(function(){ pollBad = true; }).then(function(){
    fetching = false;
    var d = nextDelay(); keep = Math.max(KEEP, d + 60000);
    clearTimeout(pollT);
    if(currentView() === 'home' && !document.hidden && trips.length) pollT = setTimeout(poll, d);
    drawCards(); checkAlarm();
  });
}
/* 省 Worker 呼叫次數：車還遠才放慢。等提醒、查詢失敗、該出門前 15 分鐘內一律維持 30 秒。 */
function nextDelay(){
  if(alarmId || pollBad || !fresh()) return POLL;
  var d = 300000;
  trips.forEach(function(t){
    var j = judge(t), w;
    if(j.none) w = j.word === '今天沒車了' || j.word === '今天沒開車' ? 300000 : j.word === '還沒發車' ? 60000 : POLL;
    else { var s = j.catchable ? j.sec - (t.walk || 0) * 60 : 0; w = s > 1800 ? 120000 : s > 900 ? 60000 : POLL; }
    d = Math.min(d, w);
  });
  return d;
}
function fresh(){ return etaAt && Date.now() - etaAt < keep; }
/* 算出一趟要顯示什麼。回傳 {bus, sec, code, hint, cls, say} */
function judge(t){
  var walk = (t.walk || 0) * 60;
  if(!fresh()) return {none:true, word:etaAt ? '暫時查不到' : '查詢中…', hint:etaAt ? '請看站牌，或等一下再看' : '', cls:''};
  var run = [], codes = [];
  t.b.forEach(function(b){ var v = etas[b.s]; if(v == null) return; if(v >= 0) run.push({b:b, v:v}); else codes.push(v); });
  run.sort(function(x, y){ return x.v - y.v; });
  if(!run.length){
    if(!codes.length){
      var srcDown = t.b.some(function(b){ return down[b.c]; });
      return {none:true, word:'暫時查不到', hint:srcDown ? '請看站牌，或等一下再看' : '站牌資料可能換了，請家人重新設定這一趟', cls:'miss'};
    }
    var w = codes.indexOf(-1) >= 0 ? ['還沒發車', '車還在總站，時間未定'] : codes.indexOf(-2) >= 0 ? ['今天不停這站', '交通管制，請看站牌公告'] : codes.indexOf(-4) >= 0 ? ['今天沒開車', '請改搭別的車'] : ['今天沒車了', '末班車已經過了'];
    return {none:true, word:w[0], hint:w[1], cls:w[0] === '還沒發車' ? '' : 'miss'};
  }
  var hit = null; for(var i = 0; i < run.length; i++){ if(run[i].v >= walk){ hit = run[i]; break; } }
  var x = hit || run[0], o = {bus:x.b, sec:x.v, catchable:!!hit, cls:''};
  var min = Math.max(1, Math.round(x.v / 60)); o.min = x.v <= 60 ? 0 : min;
  if(!walk){
    o.hint = x.v <= 60 ? '請準備上車，看清楚車號' : x.v <= 300 ? '快來了，在站牌等' : '還要等一下，可以先坐著';
    o.cls = x.v <= 300 ? 'go' : '';
  } else if(!hit){
    o.hint = '這班趕不上了，不用跑，等下一班'; o.cls = 'miss';
  } else {
    var leave = Math.floor((x.v - walk) / 60);
    if(leave <= 1){ o.hint = '現在出門剛好'; o.cls = 'go'; }
    else o.hint = '還不用急，再 ' + leave + ' 分鐘出門';
  }
  return o;
}
function sayRoute(r){ return String(r).replace(/\d/g, function(d){ return '零一二三四五六七八九'[+d]; }); }
function sayTrip(t){
  var j = judge(t);
  if(j.none) return t.name + '。' + j.word + '。' + j.hint;
  return t.name + '。' + sayRoute(j.bus.r) + '路，' + (j.min ? j.min + '分鐘後到' : '快到了') + '。' + j.hint;
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('這支手機不支援朗讀'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = +S.rate || .85;
  speechSynthesis.speak(u);
}

/* ---------- 時間到叫我 ---------- */
var alarmId = null, wake = null, actx = null;
function keepAwake(on){
  if(on && navigator.wakeLock){ navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); }
  else if(!on && wake){ wake.release().catch(function(){}); wake = null; }
}
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .45, .9].forEach(function(s){ var o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = .25; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + s); o.stop(actx.currentTime + s + .3); });
  }catch(e){}
}
function setAlarm(id){
  alarmId = id; keepAwake(!!id);
  if(id){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }catch(e){} speak('好，時間到我會叫您。請不要關掉畫面。'); poll(); }
  drawCards();
}
function checkAlarm(){
  if(!alarmId) return;
  var t = trips.filter(function(x){ return x.id === alarmId; })[0]; if(!t){ setAlarm(null); return; }
  var j = judge(t); if(j.none || !j.catchable) return;
  var left = j.sec - (t.walk || 0) * 60;
  if(left > (t.walk ? 60 : 180)) return;
  var m = sayRoute(j.bus.r) + '路' + (j.min ? '再' + j.min + '分鐘到' : '快到了');
  $('ringT').textContent = t.walk ? '該出門了！' : '車快到了！';
  $('ringM').textContent = j.bus.r + ' ' + (j.min ? '再 ' + j.min + ' 分鐘到' : '快到了');
  $('ring').classList.add('show');
  alarmId = null; keepAwake(false); beep(); if(navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
  setTimeout(function(){ speak($('ringT').textContent + m); }, 1300);
  drawCards();
}

  $('view').innerHTML = '<h2 class="q">家人幫您設好了</h2><p class="sub">按「加入」就可以用了。</p>' + l.map(function(t){ return '<div class="note" style="margin-bottom:.4rem"><b>' + esc(t.name) + '</b><br>在「' + esc(t.from) + '」上車</div>'; }).join('') + '<button class="btn main" type="button" id="yes" style="margin-top:.6rem">加入</button><a class="btn" href="#home" style="margin-top:.5rem">不要</a>';
  $('yes').onclick = function(){
    l.forEach(function(t){ var dup = trips.some(function(x){ return x.name === t.name && x.from === t.from; }); if(!dup) trips.push(t); });
    saveTrips(); location.replace('#home'); toast('加好了');
  };
}

/* ---------- 常用設定 ---------- */
function vSettings(){
  function sec(id, title, val, body){ return '<details class="set-sec" data-sec="' + id + '"><summary><span class="sst">' + title + '</span><span class="ssv">' + esc(val) + '</span></summary><div class="set-body">' + body + '</div></details>'; }
  function seg(key, opts){ return '<div class="seg" data-k="' + key + '">' + opts.map(function(o){ return '<button class="btn" type="button" data-v="' + o[0] + '" aria-pressed="' + (String(S[key]) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
  var SIZES = [[0, '大'], [1, '特大'], [2, '超大']], MODES = [['led', '站牌黑底'], ['white', '白底黑字']], RATES = [[.7, '慢'], [.85, '普通'], [1, '快']];
  function nameOf(l, v){ return (l.filter(function(o){ return String(o[0]) === String(v); })[0] || ['', ''])[1]; }
  var rows = trips.map(function(t, i){
    return '<div class="trip-row"><b>' + esc(t.name) + '</b><div class="seg"><button class="btn" type="button" data-t="up" data-i="' + i + '"' + (i ? '' : ' disabled') + '>上移</button><button class="btn" type="button" data-t="rn" data-i="' + i + '">改名</button><button class="btn danger" type="button" data-t="del" data-i="' + i + '">刪除</button></div></div>';
  }).join('') || '<p>還沒有設定。</p>';
  $('view').innerHTML = '<button class="linkbtn" type="button" id="back">← 回到公車</button><h2 class="q">⚙ 常用設定</h2>' +
    '<div class="set-tools"><button class="btn" type="button" id="exAll">全部展開</button><button class="btn" type="button" id="coAll">全部收合</button></div>' +
    sec('size', '字體大小', nameOf(SIZES, S.size), seg('size', SIZES)) +
    sec('mode', '畫面顏色', nameOf(MODES, S.mode), seg('mode', MODES)) +
    sec('rate', '朗讀速度', nameOf(RATES, S.rate), seg('rate', RATES)) +
    sec('trips', '我常去的地方', trips.length + ' 個', rows + '<button class="btn" type="button" id="addT">＋ 新增</button>') +
    sec('send', '傳給家人', '', '<p>把這裡設好的地方全部傳到另一支手機。家人可以先幫長輩設好，再用 LINE 傳過去。</p><button class="btn" type="button" id="sendAll"' + (trips.length ? '' : ' disabled') + '>💬 用 LINE 傳</button><button class="btn" type="button" id="copyAll"' + (trips.length ? '' : ' disabled') + '>複製連結</button>') +
    sec('data', '清除資料', '', '<button class="btn danger" type="button" id="clr">清除這支手機的全部資料</button>') +
    sec('about', '關於本工具', '', '<p>👤 創作者 Mark Tsai（蔡豐全）<br><a href="mailto:tsaimark@gmail.com">tsaimark@gmail.com</a></p><a class="btn" href="manual.html" target="_blank" rel="noopener">📖 操作手冊</a><button class="btn" type="button" data-warn>⚠ 使用警語</button><button class="btn" type="button" data-install>📲 加入主畫面</button><p>訪客數 <img src="' + BADGE + '" alt="訪客次數" height="20" loading="lazy" style="vertical-align:middle"></p>');
  var open = []; try{ open = JSON.parse(lsGet(FOLD_KEY) || '[]') || []; }catch(e){}
  var secs = document.querySelectorAll('.set-sec');
  function saveFold(){ var o = []; document.querySelectorAll('.set-sec').forEach(function(d){ if(d.open) o.push(d.dataset.sec); }); lsSet(FOLD_KEY, JSON.stringify(o)); }
  secs.forEach(function(d){ d.open = open.indexOf(d.dataset.sec) >= 0; d.addEventListener('toggle', saveFold); });
  $('exAll').onclick = function(){ secs.forEach(function(d){ d.open = true; }); };
  $('coAll').onclick = function(){ secs.forEach(function(d){ d.open = false; }); };
  $('back').onclick = function(){ go('home'); };
  document.querySelectorAll('.seg[data-k] button').forEach(function(b){ b.onclick = function(){
    var k = b.parentNode.dataset.k, v = b.dataset.v; S[k] = k === 'mode' ? v : +v; saveSet(); if(k === 'rate') speak('這樣的速度可以嗎？'); vSettings(); bindCommon();
  }; });
  document.querySelectorAll('[data-t]').forEach(function(b){ b.onclick = function(){
    var i = +b.dataset.i, a = b.dataset.t, t = trips[i];
    if(a === 'up'){ trips.splice(i - 1, 0, trips.splice(i, 1)[0]); }
    if(a === 'rn'){ var n = prompt('新的名字', t.name); if(!n || !n.trim()) return; t.name = n.trim().slice(0, 20); }
    if(a === 'del'){ if(!confirm('要刪除「' + t.name + '」嗎？')) return; trips.splice(i, 1); }
    saveTrips(); vSettings(); bindCommon();
  }; });
  $('addT').onclick = function(){ F = {}; go('from'); };
  $('sendAll').onclick = function(){ shareTrips(trips); };
  $('copyAll').onclick = function(){ var u = shareUrl(trips); if(navigator.clipboard){ navigator.clipboard.writeText(u).then(function(){ toast('連結已複製'); }, function(){ prompt('請複製這個連結', u); }); } else prompt('請複製這個連結', u); };
  $('clr').onclick = function(){ if(!confirm('確定要清除嗎？常去的地方和設定都會消失。')) return; [TRIPS_KEY, SET_KEY, FOLD_KEY, WARN_KEY, PREFIX + 'marquee'].forEach(lsDel); location.href = location.pathname; };
}
$('setBtn').onclick = function(){ go('settings'); };
$('aboutOk').onclick = function(){ $('about').classList.remove('show'); lsSet(WARN_KEY, '1'); };
$('ringOk').onclick = function(){ $('ring').classList.remove('show'); };

/* ---------- 跑馬燈（必備，不可關閉） ---------- */
function initMarquee(){
  var URL_ = "https://script.google.com/macros/s/AKfycbwKX0DNNbY8y4nf90BFTHtxgfqJcHHcZasRrgycl4QAe52_hkjMWSkYk4xOsqU-JPCROw/exec";
  var MK = PREFIX + 'marquee', REFRESH = 20 * 60 * 1000, bar = $('marqueeBar'), track = $('marqueeTrack'), lastKey = null;
  function loadCache(){ try{ return JSON.parse(lsGet(MK) || '[]'); }catch(e){ return []; } }
  function appendText(c, text){ var re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, li = 0, m; while((m = re.exec(text))){ if(m.index > li) c.appendChild(document.createTextNode(text.slice(li, m.index))); var a = document.createElement('a'); a.href = m[2]; a.textContent = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.style.color = 'inherit'; a.style.textDecoration = 'underline'; c.appendChild(a); li = re.lastIndex; } if(li < text.length) c.appendChild(document.createTextNode(text.slice(li))); }
  function renderM(items){
    if(!items || !items.length) return;
    var k = JSON.stringify(items); if(k === lastKey) return; lastKey = k; track.innerHTML = '';
    var fr = document.createDocumentFragment();
    function pass(){ items.forEach(function(it, i){ if(i > 0) fr.appendChild(document.createTextNode('　★　')); appendText(fr, String(it)); }); }
    pass(); fr.appendChild(document.createTextNode('　★　')); pass(); track.appendChild(fr);
    bar.classList.add('show'); document.body.classList.add('has-marquee');
    track.style.animationDuration = Math.max(track.scrollWidth / 2 / 60, 12) + 's';
  }
  function fetchM(){ fetch(URL_, {method:'POST', body:JSON.stringify({serial:''})}).then(function(r){ return r.json(); }).then(function(d){ if(d && Array.isArray(d.marquee) && d.marquee.length){ lsSet(MK, JSON.stringify(d.marquee)); renderM(d.marquee); } }).catch(function(){}); }
  renderM(loadCache()); fetchM(); setInterval(fetchM, REFRESH);
}

/* ---------- 加入主畫面 ---------- */
var dp = null, ua = navigator.userAgent || '';
var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; });
window.addEventListener('appinstalled', function(){ dp = null; toast('已加入主畫面'); });
function bindInstall(){
  document.querySelectorAll('[data-install]').forEach(function(b){
    if(standalone){ b.style.display = 'none'; return; }
    b.onclick = function(){ var m = ios ? '請按畫面上的「分享」圖示，選「加入主畫面」' : '請按瀏覽器右上角選單，選「加到主畫面」'; if(!dp){ toast(m); return; } try{ dp.prompt(); dp.userChoice.then(function(){ dp = null; }); }catch(e){ toast(m); } };
  });
}
if('serviceWorker' in navigator && location.protocol !== 'file:'){ window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); }); }

window.addEventListener('hashchange', render);
window._nbh = {judge:judge, nextDelay:nextDelay, setEtas:function(e){ etas = e; etaAt = Date.now(); drawCards(); checkAlarm(); }, findBuses:findBuses, search:search, loadIndex:loadIndex, trips:function(){ return trips; }, sayTrip:sayTrip};
applySet(); initMarquee(); render();
if(!lsGet(WARN_KEY) && currentView() !== 'add') $('about').classList.add('show');
